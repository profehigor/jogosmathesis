<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Jogos Mathesis</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:wght@500;700&display=swap">
<style>
/* Layout: cabeçalho de gravura (busto + marca), abas de jogos e uma "prancha" com moldura dupla para o jogo ativo. Só preto, papel e hachuras, como o material impresso da Mathesis. */
:root{
  --paper:#f3f2ee; --wash:#e7e5df; --ink:#151513; --ink-2:#55544f; --rule:#c8c6be;
  --display:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --text:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --num:"Source Serif 4",Georgia,"Times New Roman",serif;
  --hatch:repeating-linear-gradient(135deg,var(--rule) 0 1px,transparent 1px 6px);
  --hatch-ink:repeating-linear-gradient(135deg,var(--ink) 0 1px,transparent 1px 5px);
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--paper)}
body{
  margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.5 var(--text);
  padding-block:24px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

.mast{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:20px 28px;padding-bottom:20px;border-bottom:1px solid var(--ink);box-shadow:0 4px 0 -3px var(--paper),0 5px 0 -3px var(--ink)}
.seal{height:176px;width:auto;max-width:100%;display:block}
.eyebrow{margin:0 0 4px;font-size:.78rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2)}
h1{margin:0;font:600 clamp(2.4rem,8vw,4.4rem)/1 var(--display);letter-spacing:.2em;text-transform:uppercase}
.lede{margin:10px 0 0;max-width:46ch;color:var(--ink-2)}
.score{display:flex;flex-direction:column;align-items:center;min-width:92px;padding:10px 14px;border:1px solid var(--ink)}
.score span{font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.score b{font:700 2.2rem/1.1 var(--num);font-variant-numeric:lining-nums tabular-nums}

.tabs{display:flex;gap:0;overflow-x:auto;border:1px solid var(--ink);scrollbar-width:thin}
.tabs button{flex:1 0 auto;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:0;padding:10px 16px;border:0;border-right:1px solid var(--ink);background:var(--paper);cursor:pointer;text-align:left;white-space:nowrap}
.tabs button:last-child{border-right:0}
.tabs button b{font:700 1.25rem/1.2 var(--display)}
.tabs button small{font-size:.72rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.tabs button:hover{background:var(--wash)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.tabs button[aria-selected="true"] small{color:var(--rule)}

.plate{border:1px solid var(--ink);box-shadow:inset 0 0 0 5px var(--paper),inset 0 0 0 6px var(--ink);padding:28px clamp(18px,4vw,36px) 32px;min-height:420px;background:var(--paper)}
.plate h2{margin:0;font:700 clamp(1.8rem,5vw,2.5rem)/1.1 var(--display)}
.how{margin:6px 0 20px;max-width:62ch;color:var(--ink-2)}
#game{display:flex;flex-direction:column;gap:18px;align-items:flex-start}
#game>*{max-width:100%}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:.6em 1.2em;border:1px solid var(--ink);background:var(--ink);color:var(--paper);font-weight:700;cursor:pointer;letter-spacing:.02em}
.btn:hover{background:var(--ink-2)}
.btn.alt{background:transparent;color:var(--ink)}
.btn.alt:hover{background:var(--wash)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--ink)}
.seg button{padding:.45em 1em;border:0;border-right:1px solid var(--ink);background:var(--paper);cursor:pointer;font-weight:600}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg button:disabled{opacity:.45;cursor:not-allowed}

.hud{display:flex;flex-wrap:wrap;gap:8px 28px}
.stat{display:flex;flex-direction:column}
.stat span{font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.stat b{font:700 1.8rem/1.15 var(--num);font-variant-numeric:lining-nums tabular-nums}

.board{width:100%;padding:22px;border:2px solid var(--ink);background:var(--paper)}
.board.ok{background:var(--ink);color:var(--paper)}
.board.bad{background-image:var(--hatch);outline:2px dashed var(--ink);outline-offset:3px}
.q{font:700 clamp(2.2rem,9vw,4rem)/1.1 var(--num);text-align:center;font-variant-numeric:lining-nums;min-height:1.3em}
input.big{width:9ch;padding:.3em .4em;border:2px solid var(--ink);background:var(--paper);font:700 1.9rem/1.2 var(--num);text-align:center;font-variant-numeric:lining-nums}
input.big:disabled{background:var(--wash);color:var(--ink-2)}
.msg{margin:0;min-height:1.5em;font-weight:600}
.msg.good::before{content:"✓ ";font-weight:700}
.msg.nope::before{content:"✗ ";font-weight:700}

.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-family:var(--num);font-weight:700;line-height:1.05;font-variant-numeric:lining-nums}
.frac>span:first-child{padding:0 .3em .08em;border-bottom:.07em solid currentColor}
.frac>span:last-child{padding:.08em .3em 0}
.frac.big{font-size:2.8rem}
.ask{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-bottom:16px;font:600 1.5rem/1.2 var(--display)}
.bar{display:flex;height:64px;border:2px solid var(--ink);background:var(--paper)}
.bar>*{flex:1;min-width:0;border:0;border-right:1px solid var(--ink);background:var(--paper);padding:0;cursor:pointer}
.bar>*:last-child{border-right:0}
.bar>[aria-pressed="true"],.bar>.on{background:var(--ink)}
.bar.static>*{cursor:default}
.meta{margin-top:10px;color:var(--ink-2)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.cmp .side{display:flex;flex-direction:column;align-items:center;gap:14px;min-width:0}
.cmp .bar{width:100%;height:40px}

.grid100{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));width:min(100%,560px);border:2px solid var(--ink);background:var(--paper)}
.cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border:0;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);background:var(--paper);cursor:pointer;font:600 clamp(.8rem,2.6vw,1.1rem)/1 var(--num);font-variant-numeric:lining-nums;padding:0;min-width:0}
.cell:nth-child(10n){border-right:0}
.cell:nth-last-child(-n+10){border-bottom:0}
.cell:hover{background:var(--wash)}
.cell.struck{background-image:var(--hatch);color:var(--ink-2)}
.cell.circle{box-shadow:inset 0 0 0 2px var(--ink);font-weight:700}
.cell.prime{background:var(--ink);color:var(--paper);font-weight:700}
.cell.sel{outline:3px solid var(--ink);outline-offset:-3px}
.cell.hit{background:var(--ink);color:var(--paper)}
.info{margin:0;max-width:62ch;min-height:3em}
.info b{font-family:var(--num)}

.magic{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) minmax(0,.62fr);gap:6px;width:min(100%,420px)}
.mcell{aspect-ratio:1;border:2px solid var(--ink);background:var(--paper);cursor:pointer;font:700 clamp(1.8rem,9vw,2.8rem)/1 var(--num);font-variant-numeric:lining-nums;padding:0}
.mcell.fixed{background:var(--wash);cursor:default}
.mcell.sel{outline:4px solid var(--ink);outline-offset:2px}
.mcell.dup{background-image:var(--hatch-ink)}
.sum{display:flex;align-items:center;justify-content:center;font:600 1rem/1 var(--num);color:var(--ink-2);font-variant-numeric:lining-nums}
.sum.good{color:var(--ink);font-weight:700}
.sum.wrong{color:var(--ink);font-weight:700;background-image:var(--hatch)}
.diags{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--ink-2)}
.diags b{color:var(--ink);font-family:var(--num)}
.pal{display:flex;flex-wrap:wrap;gap:6px}
.pal button{width:52px;height:52px;border:2px solid var(--ink);background:var(--paper);cursor:pointer;font:700 1.5rem/1 var(--num);padding:0}
.pal button:hover{background:var(--wash)}
.pal button.used{color:var(--rule);border-color:var(--rule)}
.pal button.wide{width:auto;padding:0 14px;font:700 1rem/1 var(--text)}

.angle{width:min(100%,360px);height:auto;color:var(--ink);display:block;margin-inline:auto}
.angle .ray{stroke:currentColor;stroke-width:3;stroke-linecap:round}
.angle .ghost{stroke:var(--ink-2);stroke-width:2;stroke-dasharray:6 6;stroke-linecap:round}
.angle text{font:600 13px var(--num);fill:currentColor}
.angle .big{font:700 22px var(--num)}
.slider{display:flex;align-items:center;gap:16px;width:min(100%,460px)}
.slider input{flex:1;min-width:0;accent-color:var(--ink);height:32px}
.slider b{min-width:3.4ch;font:700 1.6rem/1 var(--num);font-variant-numeric:lining-nums tabular-nums;text-align:right}

.clues{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:4px;max-width:62ch}
.clues li::marker{font-family:var(--num);font-weight:700}

footer{padding-top:6px;color:var(--ink-2);font-size:.85rem;display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px;border-top:1px solid var(--rule)}

@media (max-width:720px){
  .mast{grid-template-columns:auto 1fr;gap:14px 18px}
  .seal{height:112px}
  .score{grid-column:1/-1;flex-direction:row;justify-content:space-between;gap:12px}
  .lede{display:none}
  .plate{padding-top:22px}
  .cmp{gap:12px}
  .frac.big{font-size:2.2rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
/*PURE-START*/
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[rnd(0,a.length-1)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const isPrime=m=>{if(m<2)return false;for(let i=2;i*i<=m;i++)if(m%i===0)return false;return true};
const factor=m=>{const f=[];let x=m;for(let p=2;p*p<=x;p++){let e=0;while(x%p===0){x/=p;e++}if(e)f.push([p,e])}if(x>1)f.push([x,1]);return f};
const sup=e=>String(e).split('').map(c=>'⁰¹²³⁴⁵⁶⁷⁸⁹'[+c]).join('');

function genCalc(l){
  if(l===1){
    if(Math.random()<.5){const a=rnd(2,20),b=rnd(2,20);return{t:`${a} + ${b}`,a:a+b}}
    const a=rnd(8,25),b=rnd(2,a);return{t:`${a} − ${b}`,a:a-b};
  }
  if(l===2){
    const k=rnd(0,2);
    if(k===0){const a=rnd(10,60),b=rnd(10,99-a);return{t:`${a} + ${b}`,a:a+b}}
    if(k===1){const a=rnd(30,99),b=rnd(10,a-1);return{t:`${a} − ${b}`,a:a-b}}
    const a=rnd(2,10),b=rnd(2,10);return{t:`${a} × ${b}`,a:a*b};
  }
  const k=rnd(0,3);
  if(k===0){const a=rnd(6,15),b=rnd(3,12);return{t:`${a} × ${b}`,a:a*b}}
  if(k===1){const b=rnd(2,12),q=rnd(2,12);return{t:`${b*q} ÷ ${b}`,a:q}}
  if(k===2){const a=rnd(2,20),b=rnd(2,9),c=rnd(2,9);return{t:`${a} + ${b} × ${c}`,a:a+b*c}}
  const a=rnd(2,9),b=rnd(2,9),c=rnd(2,9);return{t:`(${a} + ${b}) × ${c}`,a:(a+b)*c};
}

function cluesOnce(n){
  const ALL=Array.from({length:100},(_,i)=>i+1);
  const ds=m=>String(m).split('').reduce((a,c)=>a+ +c,0);
  const pool=[];
  pool.push(n%2===0?{t:'É um número par.',f:m=>m%2===0}:{t:'É um número ímpar.',f:m=>m%2===1});
  [3,4,5,6,7,8,9,11].forEach(k=>pool.push(n%k===0?{t:`É múltiplo de ${k}.`,f:m=>m%k===0}:{t:`Não é múltiplo de ${k}.`,f:m=>m%k!==0}));
  pool.push(isPrime(n)?{t:'É um número primo.',f:isPrime}:{t:'É um número composto.',f:m=>m>1&&!isPrime(m)});
  const len=String(n).length;
  pool.push({t:len===1?'Tem um só algarismo.':'Tem dois algarismos.',f:m=>String(m).length===len});
  pool.push({t:`A soma dos algarismos é ${ds(n)}.`,f:m=>ds(m)===ds(n)});
  const w=rnd(12,30),r=rnd(2,w-2),lo=Math.max(1,n-r),hi=Math.min(100,lo+w);
  pool.push({t:`Está entre ${lo} e ${hi}.`,f:m=>m>=lo&&m<=hi});
  let cand=ALL;const chosen=[];
  for(const c of shuffle(pool)){
    const nx=cand.filter(c.f);
    if(nx.length<cand.length&&!(nx.length===1&&chosen.length<2)){chosen.push(c);cand=nx}
    if(cand.length===1)break;
  }
  if(cand.length>1){
    const u=n%10,c1={t:`O algarismo das unidades é ${u}.`,f:m=>m%10===u};
    chosen.push(c1);cand=cand.filter(c1.f);
    if(cand.length>1){
      const t=Math.floor(n/10);
      const c2=n<10?{t:'É menor que 10.',f:m=>m<10}:{t:`O algarismo das dezenas é ${t}.`,f:m=>Math.floor(m/10)%10===t};
      chosen.push(c2);cand=cand.filter(c2.f);
    }
  }
  return chosen;
}

function buildClues(n){
  let best=null;
  for(let i=0;i<40;i++){
    const c=cluesOnce(n);
    if(c.length>=3&&c.length<=6)return c;
    if(!best||Math.abs(c.length-4)<Math.abs(best.length-4))best=c;
  }
  return best;
}

const magicSquares=(()=>{
  const rot=m=>m[0].map((_,c)=>m.map(r=>r[c]).reverse());
  const flip=m=>m.map(r=>r.slice().reverse());
  const out=[];let m=[[2,7,6],[9,5,1],[4,3,8]];
  for(let i=0;i<4;i++){out.push(m.flat());out.push(flip(m).flat());m=rot(m)}
  return out;
})();
const LINES=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
/*PURE-END*/

const $=(s,r=document)=>r.querySelector(s);
const fmt=x=>x.toFixed(2).replace('.',',');
const pl=(n,s,p)=>n===1?s:p;
let total=0;
function award(n){if(!n)return;total+=n;$('#pts').textContent=total}
function setMsg(el,text,kind){el.textContent=text;el.className='msg'+(kind?' '+kind:'')}
function frac(n,d,big){return `<span class="frac${big?' big':''}" aria-label="${n} sobre ${d}"><span>${n}</span><span>${d}</span></span>`}

/* ---------- 1. Cálculo Relâmpago ---------- */
function runCalc(root){
  let level=1,running=false,end=0,hits=0,streak=0,q=null,tm=null,tf=null;
  const best={1:0,2:0,3:0};
  root.innerHTML=`
    <div class="seg" id="c-lv" role="group" aria-label="Nível">
      <button type="button" data-l="1" aria-pressed="true">Aquecimento</button>
      <button type="button" data-l="2" aria-pressed="false">No ritmo</button>
      <button type="button" data-l="3" aria-pressed="false">Desafio</button>
    </div>
    <div class="hud">
      <div class="stat"><span>Tempo</span><b id="c-t">60</b></div>
      <div class="stat"><span>Acertos</span><b id="c-h">0</b></div>
      <div class="stat"><span>Sequência</span><b id="c-k">0</b></div>
      <div class="stat"><span>Recorde do nível</span><b id="c-b">0</b></div>
    </div>
    <div class="board q" id="c-q">Pronto?</div>
    <form class="row" id="c-f">
      <input class="big" id="c-i" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" aria-label="Sua resposta" disabled>
      <button class="btn" id="c-go" type="submit">Começar</button>
    </form>
    <p class="msg" id="c-m" aria-live="polite">Aquecimento: somas e subtrações. No ritmo: tabuada. Desafio: divisões e expressões.</p>`;
  const qb=$('#c-q',root),inp=$('#c-i',root),go=$('#c-go',root),msg=$('#c-m',root);
  const lvBtns=[...root.querySelectorAll('#c-lv button')];
  const paint=()=>{$('#c-h',root).textContent=hits;$('#c-k',root).textContent=streak;$('#c-b',root).textContent=best[level]};
  const flash=k=>{qb.classList.remove('ok','bad');void qb.offsetWidth;qb.classList.add(k);clearTimeout(tf);tf=setTimeout(()=>qb.classList.remove('ok','bad'),450)};
  const next=()=>{q=genCalc(level);qb.textContent=q.t+' = ?'};
  const tick=()=>{const left=Math.max(0,Math.ceil((end-Date.now())/1000));$('#c-t',root).textContent=left;if(left<=0)finish()};
  function start(){
    hits=0;streak=0;running=true;end=Date.now()+60000;
    lvBtns.forEach(b=>b.disabled=true);inp.disabled=false;inp.value='';go.textContent='Responder';
    setMsg(msg,'');paint();next();tm=setInterval(tick,200);tick();inp.focus();
  }
  function finish(){
    clearInterval(tm);running=false;inp.disabled=true;lvBtns.forEach(b=>b.disabled=false);go.textContent='Jogar de novo';
    const rec=hits>best[level];if(rec)best[level]=hits;paint();
    qb.classList.remove('ok','bad');qb.textContent=`Tempo! ${hits} ${pl(hits,'acerto','acertos')}`;
    setMsg(msg,rec&&hits>0?'Novo recorde neste nível. Quer superar?':'Boa! Dá para bater esse número?','good');
    go.focus();
  }
  lvBtns.forEach(b=>b.addEventListener('click',()=>{
    if(running)return;level=+b.dataset.l;
    lvBtns.forEach(x=>x.setAttribute('aria-pressed',String(x===b)));paint();
  }));
  $('#c-f',root).addEventListener('submit',e=>{
    e.preventDefault();
    if(!running){start();return}
    const v=inp.value.trim();if(v==='')return;
    if(Number(v)===q.a){hits++;streak++;award(1);flash('ok');setMsg(msg,'')}
    else{streak=0;flash('bad');setMsg(msg,`${q.t} = ${q.a}`,'nope')}
    inp.value='';paint();next();
  });
  paint();
  return()=>{clearInterval(tm);clearTimeout(tf)};
}

/* ---------- 2. Frações em Barras ---------- */
function runFrac(root){
  let mode='paint',hits=0,rounds=0;
  let d,n,sel,attempted,done,A,B;
  root.innerHTML=`
    <div class="seg" id="f-md" role="group" aria-label="Modo">
      <button type="button" data-m="paint" aria-pressed="true">Pintar a fração</button>
      <button type="button" data-m="cmp" aria-pressed="false">Qual é maior?</button>
    </div>
    <div class="hud">
      <div class="stat"><span>Acertos de primeira</span><b id="f-h">0</b></div>
      <div class="stat"><span>Rodadas</span><b id="f-r">0</b></div>
    </div>
    <div class="board" id="f-b"></div>
    <p class="msg" id="f-m" aria-live="polite"></p>
    <div class="row" id="f-a"></div>`;
  const board=$('#f-b',root),msg=$('#f-m',root),acts=$('#f-a',root);
  const paint=()=>{$('#f-h',root).textContent=hits;$('#f-r',root).textContent=rounds};
  const DEN=[2,3,4,5,6,8,10,12];

  function newPaint(){
    d=pick(DEN);n=rnd(1,d-1);sel=Array(d).fill(false);attempted=false;done=false;
    board.innerHTML=`
      <div class="ask">Pinte ${frac(n,d,true)} da barra</div>
      <div class="bar" id="f-bar">${sel.map((_,i)=>`<button type="button" data-i="${i}" aria-pressed="false" aria-label="Parte ${i+1} de ${d}"></button>`).join('')}</div>
      <div class="meta">Partes pintadas: <b id="f-c">0</b> de ${d}</div>`;
    setMsg(msg,'');
    acts.innerHTML=`<button class="btn" type="button" id="f-ok">Conferir</button>`;
  }
  function checkPaint(){
    const c=sel.filter(Boolean).length;
    if(c===n){
      done=true;
      if(!attempted){attempted=true;rounds++;hits++;award(2);setMsg(msg,`Certo! ${n} de ${d} partes pintadas. +2 pontos.`,'good')}
      else setMsg(msg,`Agora sim: ${n} de ${d} partes pintadas.`,'good');
      board.classList.add('ok');
      $('#f-bar',root).querySelectorAll('button').forEach(b=>b.disabled=true);
      acts.innerHTML=`<button class="btn" type="button" id="f-next">Próxima</button>`;
      $('#f-next',root).focus();
    }else{
      if(!attempted){attempted=true;rounds++}
      setMsg(msg,`Você pintou ${c} de ${d} partes. A fração ${n}/${d} pede ${n} ${pl(n,'parte pintada','partes pintadas')}. Ajuste e confira de novo.`,'nope');
    }
    paint();
  }

  function newCmp(){
    let n1,d1,n2,d2;
    if(Math.random()<.3){
      d1=pick([2,3,4,5,6]);n1=rnd(1,d1-1);
      const k=pick([2,3,4].filter(k=>d1*k<=12));n2=n1*k;d2=d1*k;
    }else{
      d1=pick(DEN);n1=rnd(1,d1-1);d2=pick(DEN);n2=rnd(1,d2-1);
    }
    A={n:n1,d:d1};B={n:n2,d:d2};
    if(Math.random()<.5)[A,B]=[B,A];
    done=false;
    board.innerHTML=`
      <div class="cmp">
        <div class="side">${frac(A.n,A.d,true)}<div class="bar static" id="f-ba" hidden></div></div>
        <div class="side">${frac(B.n,B.d,true)}<div class="bar static" id="f-bb" hidden></div></div>
      </div>`;
    setMsg(msg,'Qual fração representa a maior parte do inteiro?');
    acts.innerHTML=`
      <button class="btn alt" type="button" data-a="-1">A da esquerda é maior</button>
      <button class="btn alt" type="button" data-a="0">São iguais</button>
      <button class="btn alt" type="button" data-a="1">A da direita é maior</button>`;
  }
  const barHtml=(x)=>Array.from({length:x.d},(_,i)=>`<span class="${i<x.n?'on':''}"></span>`).join('');
  function answerCmp(g){
    const l=A.n*B.d,r=B.n*A.d,truth=l>r?-1:l<r?1:0;
    done=true;rounds++;
    $('#f-ba',root).innerHTML=barHtml(A);$('#f-bb',root).innerHTML=barHtml(B);
    $('#f-ba',root).hidden=false;$('#f-bb',root).hidden=false;
    const why=`Multiplicando em cruz: ${A.n}×${B.d} = ${l} e ${B.n}×${A.d} = ${r}. Em decimais: ${fmt(A.n/A.d)} e ${fmt(B.n/B.d)}.`;
    if(g===truth){hits++;award(2);setMsg(msg,`Certo! ${why} +2 pontos.`,'good')}
    else setMsg(msg,`Quase. ${truth===0?'As duas são iguais.':truth<0?'A da esquerda é maior.':'A da direita é maior.'} ${why}`,'nope');
    acts.innerHTML=`<button class="btn" type="button" id="f-next">Próxima</button>`;
    $('#f-next',root).focus();paint();
  }
  const fresh=()=>{board.classList.remove('ok');mode==='paint'?newPaint():newCmp()};

  root.addEventListener('click',e=>{
    const t=e.target.closest('button');if(!t||!root.contains(t))return;
    if(t.closest('#f-md')){
      mode=t.dataset.m;root.querySelectorAll('#f-md button').forEach(b=>b.setAttribute('aria-pressed',String(b===t)));fresh();return;
    }
    if(t.id==='f-ok')return checkPaint();
    if(t.id==='f-next')return fresh();
    if(t.closest('#f-bar')&&!done){
      const i=+t.dataset.i;sel[i]=!sel[i];t.setAttribute('aria-pressed',String(sel[i]));
      $('#f-c',root).textContent=sel.filter(Boolean).length;return;
    }
    if(t.dataset.a!==undefined&&!done)answerCmp(+t.dataset.a);
  });
  paint();newPaint();
}

/* ---------- 3. Crivo de Eratóstenes ---------- */
function runCrivo(root){
  const STEPS=[1,2,3,5,7];
  let done=new Set(),struck={},sel=null,awarded=false;
  root.innerHTML=`
    <div class="row" id="s-st"></div>
    <div class="grid100" id="s-g"></div>
    <p class="info" id="s-i" aria-live="polite">Clique em qualquer número para ver os divisores dele.</p>
    <div class="row"><button class="btn alt" type="button" id="s-r">Recomeçar</button></div>`;
  const info=$('#s-i',root);
  function describe(m){
    if(m===1)return '<b>1</b> tem um único divisor: ele mesmo. Não é primo nem composto, por isso o crivo começa riscando o 1.';
    const divs=[];for(let i=1;i<=m;i++)if(m%i===0)divs.push(i);
    if(isPrime(m))return `<b>${m}</b> é primo: só tem dois divisores, 1 e ${m}.`;
    const f=factor(m).map(([p,e])=>p+(e>1?sup(e):'')).join(' × ');
    return `<b>${m}</b> é composto. Decomposição: ${f}. Divisores: ${divs.join(', ')} (${divs.length} no total).`;
  }
  function draw(){
    const all=STEPS.every(p=>done.has(p));
    $('#s-st',root).innerHTML=STEPS.map(p=>`<button type="button" class="btn${done.has(p)?' alt':''}" data-p="${p}"${done.has(p)?' disabled':''}>${p===1?'Riscar o 1':'Riscar múltiplos de '+p}</button>`).join('');
    let h='';
    for(let m=1;m<=100;m++){
      const c=['cell'];
      if(struck[m])c.push('struck');
      if(all&&!struck[m])c.push('prime');
      else if(done.has(m)&&m>1)c.push('circle');
      if(sel===m)c.push('sel');
      h+=`<button type="button" class="${c.join(' ')}" data-m="${m}" aria-label="${m}${struck[m]?', riscado':''}">${m}</button>`;
    }
    $('#s-g',root).innerHTML=h;
    if(all){
      const left=100-Object.keys(struck).length;
      if(!awarded){awarded=true;award(5)}
      info.innerHTML=`Sobraram <b>${left}</b> números sem risco: são todos os primos até 100. Clique em um deles para conferir. ${sel?'<br>'+describe(sel):''}`;
    }else if(sel)info.innerHTML=describe(sel);
  }
  root.addEventListener('click',e=>{
    const t=e.target.closest('button');if(!t||!root.contains(t))return;
    if(t.dataset.p){
      const p=+t.dataset.p;done.add(p);
      if(p===1)struck[1]=1;else for(let m=p*2;m<=100;m+=p)if(!struck[m])struck[m]=p;
      draw();return;
    }
    if(t.dataset.m){sel=+t.dataset.m;draw();$('#s-g',root).querySelector(`[data-m="${sel}"]`).focus();return}
    if(t.id==='s-r'){done=new Set();struck={};sel=null;info.textContent='Clique em qualquer número para ver os divisores dele.';draw()}
  });
  draw();
}

/* ---------- 4. Quadrado Mágico ---------- */
function runMagic(root){
  let g,fixed,sel=-1,won=false,given=4;
  root.innerHTML=`
    <div class="seg" id="m-lv" role="group" aria-label="Dificuldade">
      <button type="button" data-n="4" aria-pressed="true">4 pistas</button>
      <button type="button" data-n="2" aria-pressed="false">2 pistas</button>
    </div>
    <div class="magic" id="m-g"></div>
    <div class="diags" id="m-d"></div>
    <div class="pal" id="m-p"></div>
    <p class="msg" id="m-m" aria-live="polite"></p>
    <div class="row"><button class="btn alt" type="button" id="m-new">Novo quadrado</button></div>`;
  const msg=$('#m-m',root);
  function fresh(){
    const sol=pick(magicSquares);g=Array(9).fill(0);fixed=Array(9).fill(false);
    shuffle([0,1,2,3,4,5,6,7,8]).slice(0,given).forEach(i=>{g[i]=sol[i];fixed[i]=true});
    sel=-1;won=false;setMsg(msg,'Toque numa casa vazia e depois num algarismo. Dica: toda linha, coluna e diagonal precisa somar 15.');draw();
  }
  function sumInfo(ix){
    const v=ix.map(i=>g[i]),s=v.reduce((a,b)=>a+b,0);
    if(v.every(Boolean))return{s,cls:s===15?'good':'wrong',txt:s===15?`${s} ✓`:`${s} ✗`};
    return{s,cls:'',txt:v.some(Boolean)?String(s):'·'};
  }
  function draw(refocus){
    const cnt={};g.forEach(v=>{if(v)cnt[v]=(cnt[v]||0)+1});
    let h='';
    for(let r=0;r<3;r++){
      for(let c=0;c<3;c++){
        const i=r*3+c,cls=['mcell'];
        if(fixed[i])cls.push('fixed');if(sel===i)cls.push('sel');if(g[i]&&cnt[g[i]]>1)cls.push('dup');
        h+=`<button type="button" class="${cls.join(' ')}" data-i="${i}" aria-label="Linha ${r+1}, coluna ${c+1}, ${g[i]||'vazia'}${fixed[i]?', fixa':''}">${g[i]||''}</button>`;
      }
      const si=sumInfo(LINES[r]);h+=`<div class="sum ${si.cls}" title="Soma da linha ${r+1}">${si.txt}</div>`;
    }
    for(let c=0;c<3;c++){const si=sumInfo(LINES[3+c]);h+=`<div class="sum ${si.cls}" title="Soma da coluna ${c+1}">${si.txt}</div>`}
    h+='<div></div>';
    $('#m-g',root).innerHTML=h;
    const d1=sumInfo(LINES[6]),d2=sumInfo(LINES[7]);
    $('#m-d',root).innerHTML=`<span>Diagonal ↘ <b>${d1.txt}</b></span><span>Diagonal ↙ <b>${d2.txt}</b></span>`;
    const used=new Set(g.filter(Boolean));
    $('#m-p',root).innerHTML=[1,2,3,4,5,6,7,8,9].map(n=>`<button type="button" data-d="${n}" class="${used.has(n)?'used':''}">${n}</button>`).join('')+'<button type="button" class="wide" data-d="0">Apagar</button>';
    if(refocus&&sel>=0)$('#m-g',root).querySelector(`[data-i="${sel}"]`).focus();
  }
  function place(d,refocus){
    if(won)return;
    if(sel<0||fixed[sel]){setMsg(msg,'Escolha primeiro uma casa vazia.');return}
    g[sel]=d;draw(refocus);
    if(g.every(Boolean)&&new Set(g).size===9&&LINES.every(L=>L.reduce((a,i)=>a+g[i],0)===15)){
      won=true;award(given===2?6:4);
      setMsg(msg,`Quadrado mágico! Todas as linhas, colunas e diagonais somam 15. +${given===2?6:4} pontos.`,'good');
    }else if(g.every(Boolean))setMsg(msg,'Ainda não. Procure as somas marcadas com ✗ e as casas hachuradas (algarismos repetidos).','nope');
    else setMsg(msg,'');
  }
  root.addEventListener('click',e=>{
    const t=e.target.closest('button');if(!t||!root.contains(t))return;
    if(t.dataset.n){given=+t.dataset.n;root.querySelectorAll('#m-lv button').forEach(b=>b.setAttribute('aria-pressed',String(b===t)));fresh();return}
    if(t.id==='m-new')return fresh();
    if(t.dataset.i!==undefined){sel=+t.dataset.i;draw(true);return}
    if(t.dataset.d!==undefined)place(+t.dataset.d,false);
  });
  root.addEventListener('keydown',e=>{
    if(!e.target.closest('.mcell'))return;
    if(/^[1-9]$/.test(e.key)){place(+e.key,true);e.preventDefault()}
    else if(['Backspace','Delete','0'].includes(e.key)){place(0,true);e.preventDefault()}
  });
  fresh();
}

/* ---------- 5. Qual é o Ângulo? ---------- */
function runAngle(root){
  const ROUNDS=5;
  let round,pts,A,t0,hint,revealed,guess;
  root.innerHTML=`
    <div class="hud">
      <div class="stat"><span>Rodada</span><b id="a-r">1/${ROUNDS}</b></div>
      <div class="stat"><span>Pontos do jogo</span><b id="a-p">0</b></div>
    </div>
    <svg class="angle" id="a-svg" viewBox="0 0 300 300" role="img" aria-label="Um ângulo desenhado entre duas semirretas"></svg>
    <div class="slider"><input id="a-s" type="range" min="0" max="180" step="1" value="90" aria-label="Seu palpite em graus"><b id="a-v">90°</b></div>
    <div class="row" id="a-a"></div>
    <p class="msg" id="a-m" aria-live="polite"></p>`;
  const svg=$('#a-svg',root),sl=$('#a-s',root),msg=$('#a-m',root),acts=$('#a-a',root);
  const pt=(deg,r)=>{const a=deg*Math.PI/180;return[150+r*Math.cos(a),150-r*Math.sin(a)]};
  const f1=x=>x.toFixed(1);
  const line=(deg,r,cls)=>{const[x,y]=pt(deg,r);return `<line class="${cls}" x1="150" y1="150" x2="${f1(x)}" y2="${f1(y)}"/>`};
  const label=(deg,r,t,cls='')=>{const[x,y]=pt(deg,r);return `<text class="${cls}" x="${f1(x)}" y="${f1(y)}" text-anchor="middle" dominant-baseline="middle">${t}</text>`};
  const sector=(a0,ang,r)=>{const[x1,y1]=pt(a0,r),[x2,y2]=pt(a0+ang,r);return `M150 150 L${f1(x1)} ${f1(y1)} A${r} ${r} 0 ${ang>180?1:0} 0 ${f1(x2)} ${f1(y2)} Z`};
  const kind=a=>a===90?'reto':a===180?'raso':a<90?'agudo':'obtuso';
  function draw(){
    let s=`<defs><pattern id="hat" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="currentColor" stroke-width="1"/></pattern></defs>`;
    s+=`<path d="${sector(t0,A,52)}" fill="url(#hat)" fill-opacity=".55" stroke="currentColor" stroke-width="1.5"/>`;
    if(hint){s+=line(t0+90,118,'ghost')+line(t0+180,118,'ghost')+label(t0+90,134,'90°')+label(t0+180,134,'180°')}
    if(revealed){s+=line(t0+guess,118,'ghost')+label(t0+guess,134,'seu chute')+label(t0+A/2,72,A+'°','big')}
    s+=line(t0,118,'ray')+line(t0+A,118,'ray')+`<circle cx="150" cy="150" r="4.5" fill="currentColor"/>`;
    svg.innerHTML=s;
  }
  function newRound(){
    A=Math.random()<.2?pick([45,90,135,180]):rnd(3,35)*5;
    t0=rnd(0,359);hint=false;revealed=false;sl.disabled=false;sl.value=90;$('#a-v',root).textContent='90°';
    $('#a-r',root).textContent=`${round}/${ROUNDS}`;$('#a-p',root).textContent=pts;
    setMsg(msg,'Quantos graus tem o ângulo sombreado?');
    acts.innerHTML=`<button class="btn alt" type="button" id="a-hint">Dica (−1 ponto)</button><button class="btn" type="button" id="a-ok">Conferir</button>`;
    draw();
  }
  function check(){
    guess=+sl.value;revealed=true;sl.disabled=true;
    const diff=Math.abs(guess-A),base=diff<=3?3:diff<=8?2:diff<=15?1:0,got=Math.min(base,hint?2:3);
    pts+=got;award(got);$('#a-p',root).textContent=pts;
    setMsg(msg,`O ângulo mede ${A}° e é ${kind(A)}. Seu chute errou por ${diff}°. ${got>0?'+'+got+' '+pl(got,'ponto','pontos')+'.':'Sem pontos desta vez.'}`,got>0?'good':'nope');
    acts.innerHTML=round<ROUNDS?`<button class="btn" type="button" id="a-next">Próxima rodada</button>`:`<button class="btn" type="button" id="a-end">Ver resultado</button>`;
    draw();
  }
  function start(){round=1;pts=0;newRound()}
  sl.addEventListener('input',()=>{$('#a-v',root).textContent=sl.value+'°'});
  root.addEventListener('click',e=>{
    const t=e.target.closest('button');if(!t)return;
    if(t.id==='a-hint'){hint=true;t.disabled=true;draw();setMsg(msg,'As linhas tracejadas marcam 90° (ângulo reto) e 180° (ângulo raso).')}
    else if(t.id==='a-ok')check();
    else if(t.id==='a-next'){round++;newRound()}
    else if(t.id==='a-end'){
      setMsg(msg,`Você fez ${pts} de ${ROUNDS*3} pontos possíveis. ${pts>=12?'Olho de transferidor!':pts>=7?'Muito bem, continue treinando.':'Use a dica de 90° para se guiar na próxima.'}`,'good');
      acts.innerHTML=`<button class="btn" type="button" id="a-again">Jogar de novo</button>`;
    }
    else if(t.id==='a-again')start();
  });
  start();
}

/* ---------- 6. Número Secreto ---------- */
function runSecret(root){
  let n,clues,tries,over,crossed;
  root.innerHTML=`
    <div class="hud">
      <div class="stat"><span>Tentativas</span><b id="n-t">0</b></div>
      <div class="stat"><span>Pistas</span><b id="n-c">0</b></div>
    </div>
    <ol class="clues" id="n-cl"></ol>
    <form class="row" id="n-f">
      <input class="big" id="n-i" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" aria-label="Seu palpite">
      <button class="btn" type="submit" id="n-go">Palpitar</button>
    </form>
    <p class="msg" id="n-m" aria-live="polite"></p>
    <div class="grid100" id="n-g"></div>
    <div class="row"><button class="btn alt" type="button" id="n-new">Novo número</button></div>`;
  const msg=$('#n-m',root),inp=$('#n-i',root);
  function fresh(){
    n=rnd(2,99);clues=buildClues(n);tries=0;over=false;crossed=new Set();
    $('#n-cl',root).innerHTML=clues.map(c=>`<li>${c.t}</li>`).join('');
    $('#n-c',root).textContent=clues.length;inp.disabled=false;inp.value='';$('#n-go',root).disabled=false;
    setMsg(msg,'Pensei em um número de 1 a 100. Clique nos números da tabela para riscar os que não servem.');draw();
  }
  function draw(){
    $('#n-t',root).textContent=tries;
    let h='';
    for(let m=1;m<=100;m++){
      const c=['cell'];if(crossed.has(m))c.push('struck');if(over&&m===n)c.push('hit');
      h+=`<button type="button" class="${c.join(' ')}" data-m="${m}" aria-pressed="${crossed.has(m)}">${m}</button>`;
    }
    $('#n-g',root).innerHTML=h;
  }
  $('#n-f',root).addEventListener('submit',e=>{
    e.preventDefault();if(over)return;
    const v=parseInt(inp.value,10);
    if(!(v>=1&&v<=100)){setMsg(msg,'Digite um número de 1 a 100.','nope');return}
    tries++;
    if(v===n){
      over=true;const pts=Math.max(1,6-tries);award(pts);inp.disabled=true;$('#n-go',root).disabled=true;
      setMsg(msg,`Acertou! Era ${n}, em ${tries} ${pl(tries,'tentativa','tentativas')}. +${pts} ${pl(pts,'ponto','pontos')}.`,'good');
    }else{
      crossed.add(v);
      const ok=clues.every(c=>c.f(v));
      setMsg(msg,ok?`${v} cumpre todas as pistas?! Confira de novo: o número secreto é outro.`:`${v} não é o número. Ele quebra pelo menos uma pista; confira qual.`,'nope');
    }
    inp.value='';draw();inp.focus();
  });
  root.addEventListener('click',e=>{
    const t=e.target.closest('button');if(!t)return;
    if(t.id==='n-new')return fresh();
    if(t.dataset.m&&!over){const m=+t.dataset.m;crossed.has(m)?crossed.delete(m):crossed.add(m);draw()}
  });
  fresh();
}

/* ---------- Estrutura da página ---------- */
const GAMES={

  fracao:{name:'Frações em Barras',topic:'Frações',how:'Pinte partes da barra para formar a fração pedida, ou compare duas frações e descubra qual é maior.',run:runFrac},
  crivo:{name:'Crivo de Eratóstenes',topic:'Primos',how:'Eratóstenes achava os números primos riscando os múltiplos. Aperte os botões e veja os primos aparecerem. Depois clique nos números para investigar os divisores.',run:runCrivo},
  magico:{name:'Quadrado Mágico',topic:'Lógica',how:'Use os algarismos de 1 a 9, sem repetir, para que toda linha, coluna e diagonal some 15. Toque numa casa vazia e depois num algarismo.',run:runMagic},
  angulo:{name:'Qual é o Ângulo?',topic:'Geometria',how:'Estime a abertura do ângulo sombreado, mova o controle e confira. São cinco rodadas, com até 3 pontos cada.',run:runAngle},
  segredo:{name:'Número Secreto',topic:'Múltiplos e divisores',how:'Descubra o número usando as pistas. Risque na tabela o que não serve e dê seu palpite. Quanto menos tentativas, mais pontos.',run:runSecret}

tabsEl.innerHTML=ORDER.map(id=>`<button type="button" role="tab" data-id="${id}" aria-selected="false"><b>${GAMES[id].name}</b><small>${GAMES[id].topic}</small></button>`).join('');
const tabs=[...tabsEl.querySelectorAll('button')];

function show(id){
  if(!GAMES[id])id='calc';
  if(cleanup){cleanup();cleanup=null}
  current=id;
  tabs.forEach(b=>{const on=b.dataset.id===id;b.setAttribute('aria-selected',String(on));b.tabIndex=on?0:-1});
  const g=GAMES[id];

function go(id){

}
tabsEl.addEventListener('click',e=>{const b=e.target.closest('button');if(b)go(b.dataset.id)});
tabsEl.addEventListener('keydown',e=>{
  if(e.key!=='ArrowRight'&&e.key!=='ArrowLeft')return;
  const i=ORDER.indexOf(current),j=(i+(e.key==='ArrowRight'?1:ORDER.length-1))%ORDER.length;
  go(ORDER[j]);tabs[j].focus();e.preventDefault();
});
window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(GAMES[id]&&id!==current)show(id)});
show(GAMES[location.hash.slice(1)]?location.hash.slice(1):'calc');
</script>

</body></html>
